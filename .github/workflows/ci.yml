name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:core
      - run: npm run typecheck -w @gt7/tools
      - run: npm run validate -w @gt7/tools
      - run: npm run test:core
      - run: npm run test:web
      - run: npm run build:web
